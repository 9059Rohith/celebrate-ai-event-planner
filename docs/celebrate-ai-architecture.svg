<g font-family="Arial,Helvetica,sans-serif" fill="#2c3931"><text x="40" y="47" font-size="24" font-weight="bold">Celebrate AI · reliable planning with optional GenAI</text><text x="40" y="75" font-size="15">Browser storage for plans. Server-only credentials. Explicit acceptance before changes.</text></g>
<g fill="#fffefa" stroke="#c6cabd" stroke-width="1.5"><rect x="40" y="115" width="215" height="95" rx="10"/><rect x="325" y="115" width="245" height="95" rx="10"/><rect x="640" y="115" width="390" height="95" rx="10"/><rect x="325" y="290" width="245" height="105" rx="10"/><rect x="640" y="290" width="390" height="105" rx="10"/></g>
